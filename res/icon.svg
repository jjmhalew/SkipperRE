<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- SkipperRE app icon (own artwork, not the game's): a red cap with a yellow checked band in a sunny park, and a
       mosquito buzzing around it. tools/mkicon.py renders it to PNG/ICO; the parts with class="detail" are left out of
       the small sizes (32 px and below). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc8ff"/>
      <stop offset="1" stop-color="#1f86d6"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9bdc4a"/>
      <stop offset="1" stop-color="#3f9a24"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ff6040"/>
      <stop offset="0.5" stop-color="#e3200f"/>
      <stop offset="1" stop-color="#a80f06"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f03018"/>
      <stop offset="1" stop-color="#9a0c05"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#cdeeff" stop-opacity="0.75"/>
    </linearGradient>
    <pattern id="check" x="250" y="604" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#ffd21f"/>
      <rect width="32" height="32" fill="#e3200f"/>
      <rect x="32" y="32" width="32" height="32" fill="#e3200f"/>
    </pattern>
    <clipPath id="tile"><rect x="32" y="32" width="960" height="960" rx="210"/></clipPath>
    <path id="crown" d="M 236 700 C 228 520 340 372 500 362 C 660 352 778 470 786 700 Z"/>
    <clipPath id="crownclip"><use href="#crown"/></clipPath>
  </defs>

  <!-- the tile: sky, sun, clouds, hill -->
  <g clip-path="url(#tile)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#sky)"/>
    <circle cx="830" cy="200" r="150" fill="#fff3a0" opacity="0.35" class="detail"/>
    <circle cx="830" cy="200" r="96" fill="#ffe45c"/>
    <g fill="#ffffff" opacity="0.92" class="detail">
      <ellipse cx="860" cy="470" rx="110" ry="40"/>
      <ellipse cx="820" cy="440" rx="70" ry="46"/>
      <ellipse cx="890" cy="448" rx="54" ry="36"/>
    </g>
    <path d="M -20 800 C 180 690 420 700 560 750 C 720 810 880 730 1044 690 L 1044 1044 L -20 1044 Z" fill="url(#hill)"/>
    <ellipse cx="600" cy="770" rx="370" ry="40" fill="#1d5e10" opacity="0.35"/>
  </g>
  <rect x="32" y="32" width="960" height="960" rx="210" fill="none" stroke="#0f5a99" stroke-width="16"/>

  <!-- the cap, facing right: crown, checked band, seams, button, then the bill on the front -->
  <g transform="translate(0 44)">
  <use href="#crown" fill="url(#red)"/>
  <g clip-path="url(#crownclip)">
    <rect x="200" y="604" width="620" height="110" fill="url(#check)"/>
    <line x1="200" y1="604" x2="820" y2="604" stroke="#4a0703" stroke-width="14"/>
    <path d="M 500 374 C 420 430 380 510 372 604" fill="none" stroke="#8e0b04" stroke-width="12" stroke-linecap="round"/>
    <path d="M 500 374 C 600 430 650 510 664 604" fill="none" stroke="#8e0b04" stroke-width="12" stroke-linecap="round"/>
    <path d="M 290 580 C 296 480 360 410 450 386 C 384 444 352 510 344 586 Z" fill="#ffffff" opacity="0.35"/>
  </g>
  <use href="#crown" fill="none" stroke="#4a0703" stroke-width="22" stroke-linejoin="round"/>
  <path d="M 676 704 C 760 660 880 650 960 676 C 990 688 990 724 958 732 C 870 744 770 744 676 728 Z"
        fill="url(#brim)" stroke="#4a0703" stroke-width="22" stroke-linejoin="round"/>
  <path d="M 720 694 C 790 670 880 664 940 680" fill="none" stroke="#ff8a6a" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <circle cx="500" cy="362" r="38" fill="#ffd21f" stroke="#4a0703" stroke-width="18"/>
  </g>

  <!-- the mosquito, with its flight path -->
  <g class="detail">
    <path d="M 96 520 C 90 420 140 340 200 310" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round"
          stroke-dasharray="1 32" opacity="0.95"/>
    <g transform="translate(270 230) rotate(14)">
      <ellipse cx="-34" cy="-70" rx="46" ry="82" transform="rotate(-30 -34 -70)" fill="url(#wing)" stroke="#1d3e5c" stroke-width="10"/>
      <ellipse cx="20" cy="-66" rx="38" ry="70" transform="rotate(20 20 -66)" fill="url(#wing)" stroke="#1d3e5c" stroke-width="10"/>
      <g fill="none" stroke="#1d3e5c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M -44 20 L -74 68 L -100 78"/>
        <path d="M -8 26 L -22 84 L -44 100"/>
        <path d="M 26 22 L 40 80 L 30 104"/>
      </g>
      <ellipse cx="-34" cy="0" rx="80" ry="38" fill="#6f8aa6" stroke="#1d3e5c" stroke-width="12"/>
      <path d="M -90 -8 L -64 8 M -60 -24 L -34 -4" stroke="#1d3e5c" stroke-width="8" stroke-linecap="round"/>
      <circle cx="70" cy="-14" r="44" fill="#8aa5c0" stroke="#1d3e5c" stroke-width="12"/>
      <path d="M 108 2 L 184 38" stroke="#1d3e5c" stroke-width="10" stroke-linecap="round"/>
      <circle cx="82" cy="-24" r="22" fill="#ffffff" stroke="#1d3e5c" stroke-width="6"/>
      <circle cx="90" cy="-21" r="10" fill="#10202e"/>
    </g>
  </g>
</svg>
