plugins {
    id 'com.android.application'
}

// the version of the Windows build (res/skipperre.rc), so every build of a release says the same
def rc = file('../../res/skipperre.rc').text
def skipperVersion = (rc =~ /"ProductVersion",\s*"([0-9.]+)"/)[0][1]
def skipperParts = skipperVersion.tokenize('.').collect { it as int }

android {
    namespace 'io.github.jjmhalew.skipperre'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'io.github.jjmhalew.skipperre'
        minSdk 24
        targetSdk 35
        versionCode skipperParts[0] * 10000 + skipperParts[1] * 100 + skipperParts[2]
        versionName skipperVersion
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'        // phones and tablets; x86_64 for the emulator and Chromebooks
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'   // 16 KB pages (Android 15 devices, Google Play)
            }
        }
    }
    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // a release signed with your own key: pass -PskipperKeystore=... -PskipperKeyAlias=... -PskipperKeyPassword=...;
            // without one the release APK carries the debug key, which is fine for installing it yourself
            signingConfig project.hasProperty('skipperKeystore') ? signingConfigs.create('skipper') {
                storeFile file(project.skipperKeystore); storePassword project.skipperKeyPassword
                keyAlias project.skipperKeyAlias; keyPassword project.skipperKeyPassword
            } : signingConfigs.debug
        }
    }
    lint {
        abortOnError false
    }
}
